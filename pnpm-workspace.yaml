overrides:
  "@esbuild-kit/core-utils>esbuild": "^0.25.0"
  lodash: "^4.18.1"

allowBuilds:
  workerd: true
  esbuild: true
  better-sqlite3: true
  sharp: true
  # Transitive via better-auth's optional prisma-adapter (we use
  # drizzleAdapter, never Prisma) — no build script needed.
  "@prisma/client": false
  # Transitive via posthog-js; its postinstall is a donation nag, no
  # native build.
  core-js: false
  # Transitive via eslint-import-resolver-typescript / eslint-plugin-import-x;
  # ships a native resolver binary lint actually uses.
  unrs-resolver: true

minimumReleaseAgeExclude:
  - "@cloudflare/vite-plugin@1.54.2"
  - "@cloudflare/workerd-darwin-64@1.20260828.1"
  - "@cloudflare/workerd-darwin-arm64@1.20260828.1"
  - "@cloudflare/workerd-linux-64@1.20260828.1"
  - "@cloudflare/workerd-linux-arm64@1.20260828.1"
  - "@cloudflare/workerd-windows-64@1.20260828.1"
  - "@posthog/browser-common@0.7.0"
  - "@posthog/core@1.49.2"
  - "@posthog/types@1.407.1"
  - "@vitejs/plugin-react@6.1.1"
  - lucide-react@1.35.0
  - miniflare@5.20260828.0-alpha
  - posthog-js@1.422.5
  - workerd@1.20260828.1
  - wrangler@4.127.1
  - zod@4.5.1
