# `cli/` publishes standalone to npm (see .github/workflows/publish-cli.yml)
# and is built with the root toolchain (`pnpm cli:build`), not installed as
# its own workspace package — its package.json is npm-publish metadata only.
# Without this, pnpm's implicit "all subdirectories" default pulls cli/
# into the workspace and frozen-lockfile installs break whenever cli's
# metadata deps drift from the (nonexistent) cli lockfile entry.
packages:
  - "."

overrides:
  "@esbuild-kit/core-utils>esbuild": "^0.25.0"
  lodash: "^4.18.1"

allowBuilds:
  workerd: true
  esbuild: true
  better-sqlite3: true
  sharp: true
  # Transitive via better-auth's optional prisma-adapter (we use
  # drizzleAdapter, never Prisma) — no build script needed.
  "@prisma/client": false
  # Transitive via posthog-js; its postinstall is a donation nag, no
  # native build.
  core-js: false
  # Transitive via eslint-import-resolver-typescript / eslint-plugin-import-x;
  # ships a native resolver binary lint actually uses.
  unrs-resolver: true

minimumReleaseAgeExclude:
  - "@cloudflare/vite-plugin@1.54.3"
  - "@nicia-ai/typegraph@0.53.0 || 0.54.0"
  - "@posthog/browser-common@0.7.1"
  - "@posthog/core@1.50.2"
  - "@posthog/types@1.407.1"
  - "@types/node@26.4.1"
  - "@vitejs/plugin-react@6.1.1"
  - globals@17.12.0
  - lucide-react@1.39.0
  - miniflare@5.20260831.0-alpha
  - posthog-js@1.424.1
  - wrangler@4.128.0
